name: Vigilancia de FastFood

# Revisa desde AFUERA del servidor que FastFood responda (si el VPS se cae, este
# repo igual avisa). Repo público en la cuenta de máquina `systemangelacer0-prog`:
# Actions no gasta cupo. Las tareas programadas de la app NO van aquí: las hace el
# trabajador del VPS (scripts/worker-outbox.mjs en el repo de FastFood).
#
# Si algo falla 3 veces seguidas (con 20 s entre intentos, para no alarmar por un
# parpadeo de red): el workflow queda en rojo (GitHub manda correo a la cuenta) y se
# abre un aviso en Issues con la etiqueta «caido». Cuando vuelve, el aviso se cierra
# solo con la hora en que se recuperó.
#
# Secretos (Settings → Secrets and variables → Actions), opcionales:
#   HEALTH_CHECK_SECRET  mismo valor del .env.production del VPS; sin él se salta
#                        la revisión de WhatsApp por negocio.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: vigilancia
  cancel-in-progress: false

env:
  SITE_URL: https://fastfoodportobello.duckdns.org

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revisar la app
        id: revisar
        env:
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
        run: |
          set -u
          fallas=""
          resumen=""
          # revisar <nombre> <ruta> [encabezado]
          revisar() {
            local nombre="$1" ruta="$2" header="${3:-}" codigo="000" tiempo="0"
            for intento in 1 2 3; do
              if [ -n "$header" ]; then
                read -r codigo tiempo < <(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 20 -H "$header" "${SITE_URL}${ruta}" || echo "000 0")
              else
                read -r codigo tiempo < <(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 20 "${SITE_URL}${ruta}" || echo "000 0")
              fi
              [ "$codigo" = "200" ] && break
              [ "$intento" -lt 3 ] && sleep 20
            done
            resumen="${resumen}| ${nombre} | ${codigo} | ${tiempo} s |"$'\n'
            if [ "$codigo" != "200" ]; then fallas="${fallas}- ${nombre}: respondió ${codigo} tras 3 intentos"$'\n'; fi
          }
          revisar "App viva" "/api/health/live"
          revisar "Base de datos alcanzable" "/api/health/ready"
          revisar "Tienda de Portobello" "/r/portobello-pizza"
          if [ -n "${HEALTH_CHECK_SECRET}" ]; then
            revisar "WhatsApp por negocio" "/api/health/waha" "Authorization: Bearer ${HEALTH_CHECK_SECRET}"
          fi
          {
            echo "### Vigilancia $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "| Revisión | Código | Tiempo |"
            echo "|---|---|---|"
            printf "%s" "$resumen"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "fallas<<FIN"
            printf "%s" "$fallas"
            echo "FIN"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$fallas" ]; then
            printf "%s" "$fallas"
            exit 1
          fi

      - name: Abrir o actualizar el aviso
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FALLAS: ${{ steps.revisar.outputs.fallas }}
        run: |
          gh label create caido --color B60205 --description "FastFood no responde" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          abierto=$(gh issue list -R "$GITHUB_REPOSITORY" --label caido --state open --json number --jq '.[0].number')
          cuerpo=$(printf "Falló a las %s UTC:\n\n%s\nCorrida: %s/%s/actions/runs/%s" "$(date -u +'%H:%M')" "$FALLAS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" -R "$GITHUB_REPOSITORY" --body "$cuerpo"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label caido --title "FastFood no responde ($(date -u +'%Y-%m-%d %H:%M UTC'))" --body "$cuerpo"
          fi

      - name: Cerrar el aviso si ya volvió
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          abierto=$(gh issue list -R "$GITHUB_REPOSITORY" --label caido --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$abierto" ]; then
            gh issue close "$abierto" -R "$GITHUB_REPOSITORY" --comment "Volvió a responder a las $(date -u +'%H:%M') UTC."
          fi
